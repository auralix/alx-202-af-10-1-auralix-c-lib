# Auralix C Library - PC Unit Tests
# Target standard: uv-managed (uv sync --locked && uv run pytest).
# uv is not yet installed on all workstations - until then, any Python >= 3.10
# with pytest >= 8 runs the suite directly:  python -m pytest
[project]
name = "alx-c-lib-tests"
version = "0.1.0"
description = "PC unit tests for Auralix C Library modules (pytest + ctypes over per-module DLLs)"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-html>=4",
    "pytest-timeout>=2",
    "pytest-randomly>=4",
    "lcov-cobertura>=2",
    "codespell>=2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
# no test may hang the run (C infinite loop / stuck serial read) - generous global guard,
# per-test overrides via @pytest.mark.timeout(n)
timeout = 120
# an xfail test that unexpectedly PASSES is a failure - stale expected-to-fail markers must die
xfail_strict = true
# every run writes both evidence artifacts (gitignored build/):
#   pytest_report.xml  - junit XML, machine-readable (CI)
#   pytest_report.html - self-contained HTML, human-readable (open in browser)
# --strict-markers/--strict-config: typos in markers/config are errors, not silence
addopts = "-ra --strict-markers --strict-config --junitxml=build/pytest_report.xml --html=build/pytest_report.html --self-contained-html"
markers = [
    "unit: PC unit test of a c-lib module (no hardware required)",
    "hil: hardware-in-loop test (requires device on serial port)",
    "req(id): additional proof/requirement id attached by a LATER task (name keeps the originating token)",
]
# xunit1: allows per-testcase <property> elements (proof tokens) without schema friction
junit_family = "xunit1"
# unexpected warnings are failures - silence nothing silently
filterwarnings = [
    "error",
]
