# Auralix C Library - PC Unit Tests
# Standard: uv-managed (uv sync --locked -> Test/.venv, the environment of the dev loop and of every lane);
# lanes = nox sessions named after the pipeline stages (Test/noxfile.py):  uv run nox -l
# Without uv: any Python >= 3.11 with these dependencies installed runs the suite directly
# (pip install "alx-202-2-af-1-auralix-py-lib @ git+https://github.com/auralix/alx-202-2-af-1-auralix-py-lib@v0.7.0"
# pytest pytest-html pytest-timeout pytest-randomly lcov-cobertura codespell ruff universalmutator nox):  python -m pytest
[project]
name = "alx-c-lib-tests"
version = "0.1.0"
description = "PC unit tests for Auralix C Library modules (pytest + ctypes over per-module DLLs)"
requires-python = ">=3.11"
dependencies = [
    "alx-202-2-af-1-auralix-py-lib @ git+https://github.com/auralix/alx-202-2-af-1-auralix-py-lib@v0.7.0",
    "pytest>=8",
    "pytest-html>=4",
    "pytest-timeout>=2",
    "pytest-randomly>=4",
    "lcov-cobertura>=2",
    "codespell>=2",
    "ruff>=0.5",                             # ANALYZE stage 0: the shared test profile (alx.verify.ruff_tests_config)
    "universalmutator>=1.14",
    "nox>=2024",                             # the lane runner (Test/noxfile.py, one session per stage)
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
# no test may hang the run (C infinite loop / stuck serial read) - generous global guard,
# per-test overrides via @pytest.mark.timeout(n)
timeout = 120
# an xfail test that unexpectedly PASSES is a failure - stale expected-to-fail markers must die
xfail_strict = true
# every run writes both evidence artifacts (gitignored build/):
#   pytest_report.xml  - junit XML, machine-readable (CI)
#   pytest_report.html - self-contained HTML, human-readable (open in browser)
# --strict-markers/--strict-config: typos in markers/config are errors, not silence
addopts = "-ra --strict-markers --strict-config --junitxml=build/pytest_report.xml --html=build/pytest_report.html --self-contained-html"
markers = [
    "unit: PC unit test of a c-lib module (no hardware required)",
    "hil: hardware-in-loop test (requires device on serial port)",
    "req(id): additional proof/requirement id attached by a LATER task (name keeps the originating token)",
    "expect_assert(reason): this test trips one of the LIBRARY's own assertions on purpose - the reason is required",
    "variants: builds the group in every named configuration (conftest.VARIANTS) rather than just the default one",
]
# xunit1: allows per-testcase <property> elements (proof tokens) without schema friction
junit_family = "xunit1"
# unexpected warnings are failures - silence nothing silently
filterwarnings = [
    "error",
]
