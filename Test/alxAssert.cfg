<?xml version="1.0"?>
<!--
	Auralix C Library - what cppcheck has to be told about the assert handlers.

	ALX_ASSERT_RST(file, expr) expands to `if (expr) {} else { AlxAssert_Rst(...); }`, and on a
	product that enables assertions the override behind AlxAssert_Rst resets the MCU. cppcheck
	cannot know that: alxAssert.h declares all three handlers as plain `void`, so the analyser
	follows the else branch back out and reasons about the code after the assertion as reachable
	with the asserted condition FALSE. The usual result is nullPointerRedundantCheck on the
	ordinary shape `MODULE_ASSERT(p != NULL); ... *p ...`, reported as "either the condition is
	redundant or there is a possible null pointer dereference" - a finding that is an artefact of
	the declaration rather than anything about the code.

	The obvious remedy does not work, and that was measured rather than assumed: adding
	__attribute__((noreturn)) or _Noreturn to the declaration in alxAssert.h leaves the finding
	exactly where it was, at --std=c99 and at --std=c11 alike. This file does clear it, and it
	costs no change to any library source. Test/test_alxAssert.py proves all three of those
	statements as a characterization, so the claim stays true or the suite says so.

	Rst and Bkpt are marked noreturn and Trace deliberately is not. On a shipped board a reset
	does not come back and a breakpoint either stops in a debugger or faults without one, but
	AlxAssert_Trace writes a line and returns - saying otherwise here would suppress real findings
	in the one configuration where execution genuinely continues.

	Usage:  cppcheck --library=Test/alxAssert.cfg ...
-->
<def format="2">
	<function name="AlxAssert_Rst">
		<noreturn>true</noreturn>
		<arg nr="1" direction="in"><not-uninit/></arg>
		<arg nr="2" direction="in"><not-uninit/></arg>
		<arg nr="3" direction="in"><not-uninit/></arg>
	</function>
	<function name="AlxAssert_Bkpt">
		<noreturn>true</noreturn>
		<arg nr="1" direction="in"><not-uninit/></arg>
		<arg nr="2" direction="in"><not-uninit/></arg>
		<arg nr="3" direction="in"><not-uninit/></arg>
	</function>
	<function name="AlxAssert_Trace">
		<noreturn>false</noreturn>
		<arg nr="1" direction="in"><not-uninit/></arg>
		<arg nr="2" direction="in"><not-uninit/></arg>
		<arg nr="3" direction="in"><not-uninit/></arg>
	</function>
</def>
