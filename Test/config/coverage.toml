# The lines of the library no host test can reach, taken out of the coverage gate's figures: the
# gate alx.verify.gates.coverage of the Python library (v0.18.8) reads this file by --exclusions
# (Test/noxfile.py, the coverage lane), so that the sources carry no coverage comments.
#
# One [[exclude]] table per exemption: file (by its trailing path), kind, line (the line's code, its
# comment and spacing aside; or match, a regex; the function's name for kind function), reason;
# function narrows the search to that function's lines, nth picks the nth match. Kind branches
# takes the line out of branches alone; lines
# out of every metric; block takes the line and the block it opens (its braces, or the statements to
# its break or return) out of every metric; function takes the function's body. The gate lists every
# entry under its file and fails a stale one: a match the source no longer holds, a reached line,
# a branch exclusion whose every branch was taken.
#
# A93 names the host's layout of enumeration and mixed-type bit-fields (Ext/alxAds114s08.c,
# Ext/alxAdxl355.c, Ext/alxAds8678.c): those lines go with A93. Every other entry is a line the
# code's own structure leaves unreachable - the else after an exhaustive chain, the default of a
# switch over the enumeration, a constant loop condition, a calloc that does not fail on the host,
# an uncalled reader kept under ALX_UNUSED; folding or deleting such code is the task of the
# coverage effort over every file.

