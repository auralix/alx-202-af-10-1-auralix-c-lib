# Auralix C Library - the configuration matrix (decision 13; wiki Design/ConfigurationMatrix.md).
#
# Every alx file is compiled in every row; the union of the coverage rows compiles every line of alx code.
# A row is <id>_<toolchain>_<platform>_<features>_<target>_<library>: the id is allocated once and never
# renumbered, a new row takes the next free id at the end; every word is a fragment
# config/matrix/<axis>/<word>.h, written by harness.host.matrix from alxConfig_TEMPLATE.h.
# Run:  uv run nox -s matrix                    every row, then the gate
#       uv run nox -s matrix -- 0001 0045        the rows whose id or name starts so (no gate)
# Paths are relative to Test/. The mechanism is the Python library's alx.verify.configs.

# The build define every product with littlefs sets: alxLfsConfig.h is littlefs's configuration header;
# and littlefs's LFS_THREADSAFE, so alxFs.c's lock hooks compile - nothing compiles only without it.
defines = ["LFS_CONFIG=alxLfsConfig.h", "LFS_THREADSAFE"]

# The fakes of the features, on every row's include path after the library's own folders.
includes = ["host/shim/cmsis-dsp", "host/shim/freertos", "host/shim/freertos-cellular", "host/shim/littlefs", "host/shim/lwip", "host/shim/mbedtls", "host/shim/mcuboot", "host/shim/stm32-usb-host", "host/shim/wiznet"]

# The rows that compile every trace and every assert with its arguments count for coverage, and the
# template as shipped (INF) for the branches below VRB, which the VRB rows cannot reach.
[coverage]
library = ["trace-vrb-assert-bkpt-opt-none", "trace-vrb-assert-bkpt-opt-dbg", "trace-inf-assert-rst-opt-none"]

[platform.stm32f0]
description = "STM32F0, Cortex-M0, the STM32F030x8 part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32F030x8"]
flags = ["-mcpu=cortex-m0", "-mthumb", "-mfloat-abi=soft"]

[platform.stm32f1]
description = "STM32F1, Cortex-M3, the STM32F103xB part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32F103xB"]
flags = ["-mcpu=cortex-m3", "-mthumb", "-mfloat-abi=soft"]

[platform.stm32f4]
description = "STM32F4, Cortex-M4F, the STM32F429xx part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32F429xx"]
flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[platform.stm32f7]
description = "STM32F7, Cortex-M7 with the double-precision FPU, the STM32F765xx part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32F765xx"]
flags = ["-mcpu=cortex-m7", "-mthumb", "-mfpu=fpv5-d16", "-mfloat-abi=hard"]

[platform.stm32g4]
description = "STM32G4, Cortex-M4F, the STM32G474xx part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32G474xx"]
flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[platform.stm32l0]
description = "STM32L0, Cortex-M0+, the STM32L073xx part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32L073xx"]
flags = ["-mcpu=cortex-m0plus", "-mthumb", "-mfloat-abi=soft"]

[platform.stm32l4]
description = "STM32L4, Cortex-M4F, the STM32L476xx part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32L476xx"]
flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[platform.stm32u5]
description = "STM32U5, Cortex-M33F, the STM32U575xx part"
includes = ["host/shim/stm32", "host/shim/cmsis"]
defines = ["STM32U575xx"]
flags = ["-mcpu=cortex-m33", "-mthumb", "-mfpu=fpv5-sp-d16", "-mfloat-abi=hard"]

[platform.lpc17xx]
description = "LPC17xx (LPCOpen), Cortex-M3"
includes = ["host/shim/lpcopen", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m3", "-mthumb", "-mfloat-abi=soft"]

[platform.lpc55s6x]
description = "LPC55S6x (MCUXpresso SDK), Cortex-M33F"
includes = ["host/shim/mcux-lpc55s6x", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m33", "-mthumb", "-mfpu=fpv5-sp-d16", "-mfloat-abi=hard"]

[platform.lpc80x]
description = "LPC80x (MCUXpresso SDK), Cortex-M0+"
includes = ["host/shim/mcux-lpc80x", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m0plus", "-mthumb", "-mfloat-abi=soft"]

[platform.lpc84x]
description = "LPC84x (MCUXpresso SDK), Cortex-M0+"
includes = ["host/shim/mcux-lpc84x", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m0plus", "-mthumb", "-mfloat-abi=soft"]

[platform.sam]
description = "SAM (Atmel START, ASF4), Cortex-M0+"
includes = ["host/shim/asf4", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m0plus", "-mthumb", "-mfloat-abi=soft"]

[platform.ra]
description = "RA (Renesas FSP), Cortex-M4F"
includes = ["host/shim/fsp", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[platform.zephyr]
description = "Zephyr RTOS, on a Cortex-M4F"
includes = ["host/shim/zephyr", "host/shim/cmsis"]
defines = []
flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[platform.zephyr-kconfig]
description = "Zephyr RTOS, on a Cortex-M4F, with the Kconfig options the backends test"
includes = ["host/shim/zephyr", "host/shim/cmsis"]
defines = ["CONFIG_ADC_CONFIGURABLE_INPUTS=1", "CONFIG_THREAD_NAME=1", "CONFIG_TIMER_HAS_64BIT_CYCLE_COUNTER=1"]
flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]

[platform.host]
description = "the PC the host lanes run on, compiled for its 32-bit form"
host = true
includes = ["host/shim/cmsis"]
# alxAssert.c, alxBoot.c and alxIrq.c call the CMSIS core without a platform header to bring it
flags = ["-include", "cmsisHostShim.h"]

[[exempt]]
file = "*"
guard = "__cplusplus"
why = "the C++ linkage block of every header; the library is compiled as C"

[[exempt]]
file = "Mcu/McuLpc/McuLpc80x/alxPwm_McuLpc80x.c"
guard = ""
why = "an unfinished backend: its ALX_LPC80X_TODO guard keeps the whole file out of every build (decision 12, TV 2026-09-30)"

[[exempt]]
file = "alxConfig_TEMPLATE.h"
guard = ""
why = "the base header of every row: each row compiles its own synthesized copy of it"

[[exempt]]
file = "alxConfigUsr_TEMPLATE.h"
guard = ""
why = "a product's optional user configuration: the template includes alxConfigUsr.h only once a product uncomments that line"

[[exempt]]
file = "alxBootMetadata_GENERATED_TEMPLATE.h"
guard = ""
why = "the stand-in for the header alxBoot.py generates into the library root; where a product's build left the generated one there, alxBoot.c includes that one instead"

[[exempt]]
file = "alxLfsConfig.h"
guard = "LFS_NO_INTRINSICS"
why = "littlefs's fallbacks for compilers without the GCC builtins, taken over with its utility header: every Auralix toolchain is GCC or clang"

[[exempt]]
file = "alxLfsConfig.h"
guard = "BYTE_ORDER"
why = "littlefs's big-endian and unknown-order fallbacks, taken over with its utility header: every Auralix target is little-endian"

[[exempt]]
file = "alxLfsConfig.h"
guard = "LFS_NO_MALLOC"
why = "littlefs's build without malloc, taken over with its utility header: no Auralix configuration sets LFS_NO_MALLOC"

# Findings kept by decision: reported with the reason, failing no row.
[[accept]]
file = "alxBuild.c"
text = "[-W#pragma-messages]"
why = "the build stamp alxBuild.c prints on purpose; clang reports a #pragma message as a warning, gcc as a note"

[[accept]]
file = "alxBoot.c"
text = "format specifies type 'unsigned long *' but the argument has type 'uint32_t *'"
why = "the frozen firmware file-name parser (decision 12, TV 2026-09-30): %lu is right on arm-none-eabi-gcc, which builds the bootloader"

